<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>USD/INR 2003 Prediction</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace;
          padding: 20px; }
  h1   { text-align: center; color: #58a6ff; font-size: 1.5em; margin-bottom: 6px; }
  .stats { display: flex; gap: 16px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
  .sb  { background: #161b22; border: 1px solid #30363d; border-radius: 6px;
          padding: 10px 20px; text-align: center; }
  .sv  { font-size: 1.6em; color: #ff8c00; font-weight: bold; }
  .sl  { font-size: 0.75em; color: #8b949e; margin-top: 2px; }
  .leg { display: flex; gap: 20px; justify-content: center; margin: 8px 0;
          font-size: 0.8em; flex-wrap: wrap; }
  .li  { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .chart-wrap { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
                 padding: 16px; margin: 12px 0; }
  canvas { max-height: 320px; }
  .back { text-align: center; margin-top: 16px; }
  .back a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>
<h1>USD/INR Next-Day Close Prediction — 2003</h1>

<div class="stats">
  <div class="sb"><div class="sv">0.168%</div><div class="sl">Avg Abs Error</div></div>
  <div class="sb"><div class="sv">0.218%</div><div class="sl">65th Pct Error</div></div>
  <div class="sb"><div class="sv">23</div><div class="sl">Trading Days</div></div>
  <div class="sb"><div class="sv">0</div><div class="sl">High Vol Days</div></div>
  <div class="sb"><div class="sv">0</div><div class="sl">Low Vol Days</div></div>
  <div class="sb"><div class="sv">23</div><div class="sl">Medium Vol Days</div></div>
</div>

<div class="leg">
  <div class="li"><div class="dot" style="background:#ff5050"></div>High vol: full GARCH shift</div>
  <div class="li"><div class="dot" style="background:#50c864"></div>Low vol: flat (same price)</div>
  <div class="li"><div class="dot" style="background:#648cff"></div>Medium vol: half GARCH shift</div>
</div>

<div class="chart-wrap">
  <canvas id="c1"></canvas>
</div>
<div class="chart-wrap">
  <canvas id="c2"></canvas>
</div>
<div class="chart-wrap">
  <canvas id="c3"></canvas>
</div>

<div class="back"><a href="index.html">← Back to Index</a></div>

<script>
const labels    = ["2003-12-01", "2003-12-02", "2003-12-03", "2003-12-04", "2003-12-05", "2003-12-08", "2003-12-09", "2003-12-10", "2003-12-11", "2003-12-12", "2003-12-15", "2003-12-16", "2003-12-17", "2003-12-18", "2003-12-19", "2003-12-22", "2003-12-23", "2003-12-24", "2003-12-25", "2003-12-26", "2003-12-29", "2003-12-30", "2003-12-31"];
const actual    = [45.629, 45.55, 45.548, 45.449, 45.47, 45.431, 45.371, 45.449, 45.422, 45.468, 45.468, 45.389, 45.427, 45.422, 45.452, 45.389, 45.442, 45.445, 45.441, 45.549, 45.499, 45.53, 45.527];
const predicted = [45.5951, 45.5184, 45.4428, 45.444, 45.3487, 45.3722, 45.3364, 45.2795, 45.3599, 45.3351, 45.3837, 45.386, 45.3096, 45.3491, 45.3462, 45.3782, 45.3172, 45.3715, 45.376, 45.3737, 45.4832, 45.4333, 45.4654];
const errorInr  = [-0.0339, -0.0316, -0.1052, -0.005, -0.1213, -0.0588, -0.0346, -0.1695, -0.0621, -0.1329, -0.0843, -0.003, -0.1174, -0.0729, -0.1058, -0.0108, -0.1248, -0.0735, -0.065, -0.1753, -0.0158, -0.0967, -0.0616];
const errorPct  = [-0.0742, -0.0695, -0.2309, -0.011, -0.2667, -0.1295, -0.0762, -0.373, -0.1367, -0.2922, -0.1855, -0.0066, -0.2585, -0.1605, -0.2328, -0.0237, -0.2746, -0.1617, -0.1431, -0.3848, -0.0347, -0.2124, -0.1352];
const ptColors  = ["rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)", "rgba(100,140,255,0.25)"];

const gridColor  = 'rgba(255,255,255,0.06)';
const tickColor  = '#8b949e';
const baseOpts   = {
  responsive: true,
  animation: false,
  interaction: { mode: 'index', intersect: false },
  plugins: { legend: { labels: { color: '#c9d1d9', font: { family: 'Courier New' } } } },
  scales: {
    x: { ticks: { color: tickColor, maxTicksLimit: 12, font: { size: 10 } },
           grid: { color: gridColor } },
    y: { ticks: { color: tickColor }, grid: { color: gridColor } },
  }
};

new Chart(document.getElementById('c1'), {
  type: 'line',
  data: {
    labels,
    datasets: [
      { label: 'Actual Close (INR)', data: actual,
         borderColor: '#26a69a', backgroundColor: 'transparent',
         borderWidth: 2, pointRadius: 0, tension: 0.1 },
      { label: 'Predicted Close (INR)', data: predicted,
         borderColor: '#ff8c00', backgroundColor: 'transparent',
         borderWidth: 1.5, borderDash: [4, 3], pointRadius: 3,
         pointBackgroundColor: ptColors, tension: 0.1 },
    ]
  },
  options: { ...baseOpts,
    plugins: { ...baseOpts.plugins,
      title: { display: true, text: 'Actual vs Predicted Close Price',
                color: '#58a6ff', font: { size: 14 } } } }
});

const barColors = errorInr.map(v => v === null ? 'grey' : v >= 0 ? 'rgba(38,166,154,0.75)' : 'rgba(239,83,80,0.75)');
new Chart(document.getElementById('c2'), {
  type: 'bar',
  data: {
    labels,
    datasets: [{ label: 'Prediction Error (INR)', data: errorInr,
                  backgroundColor: barColors, borderWidth: 0 }]
  },
  options: { ...baseOpts,
    plugins: { ...baseOpts.plugins,
      title: { display: true, text: 'Error: Predicted − Actual (INR)',
                color: '#58a6ff', font: { size: 14 } } } }
});

new Chart(document.getElementById('c3'), {
  type: 'line',
  data: {
    labels,
    datasets: [{ label: 'Absolute Error (%)', data: errorPct.map(v => v === null ? null : Math.abs(v)),
                  borderColor: '#e377c2', backgroundColor: 'rgba(227,119,194,0.12)',
                  borderWidth: 1.5, pointRadius: 0, fill: true, tension: 0.1 }]
  },
  options: { ...baseOpts,
    plugins: { ...baseOpts.plugins,
      title: { display: true, text: 'Absolute Error (%)',
                color: '#58a6ff', font: { size: 14 } } } }
});
</script>
</body>
</html>
